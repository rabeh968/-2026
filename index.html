<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17795c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أدوية">
<title>أدوية المنزل</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2b25;--mut:#68766f;--pri:#17795c;--pri-t:#fff;--bd:#e1e6e2;--red:#c0392b;--org:#c77a0a;--grn:#17795c;--redb:#fbe9e6;--orgb:#fdf1de;--grnb:#e4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;padding:0 14px 120px}
h1{font-size:20px;margin:16px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.st{flex:1;border-radius:12px;padding:8px;text-align:center;font-size:12px}
.st b{display:block;font-size:20px}
.s-r{background:var(--redb);color:var(--red)}.s-o{background:var(--orgb);color:var(--org)}.s-g{background:var(--grnb);color:var(--grn)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card .m{flex:1;min-width:0}
.nm{font-weight:700}
.dt{font-size:12px;color:var(--mut);margin-top:2px}
.badge{font-size:12px;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-r{background:var(--redb);color:var(--red)}.b-o{background:var(--orgb);color:var(--org)}.b-g{background:var(--grnb);color:var(--grn)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer}
button.p{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:700}
button.d{color:var(--red)}
.q{display:flex;align-items:center;gap:6px}
.q button{padding:4px 10px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px}
.bar button{flex:1;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}.seg button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.pane{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>div{flex:1}
.th{height:60px;width:auto;min-width:48px;max-width:110px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;cursor:pointer}.ph{display:flex;align-items:center;justify-content:center;font-size:22px;width:60px}.al{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.7}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.msg{font-size:13px;margin:8px 0;color:var(--mut)}
.msg.err{color:var(--red)}
.note{font-size:12px;color:var(--mut);margin-top:16px;text-align:center}
</style>
</head>
<body>
<h1>💊 أدوية المنزل</h1>
<div class="sub">قائمة الأدوية المتوفرة مع تواريخ انتهاء الصلاحية</div>
<div class="stats">
  <div class="st s-r"><b id="cR">0</b>منتهية</div>
  <div class="st s-o"><b id="cO">0</b>تنتهي خلال 90 يوماً</div>
  <div class="st s-g"><b id="cG">0</b>صالحة</div>
</div>
<div id="al"></div><input id="srch" placeholder="بحث باسم الدواء أو المادة الفعالة…">
<div id="list"></div>
<div class="note">البيانات محفوظة في هذا المتصفح فقط. استعمل «نسخ احتياطي» للحفظ.</div>
<div class="note" id="sy"></div>
<div class="note"><button id="gt">اختبار الاتصال</button> <button id="gs">⚙︎ مفتاح Gemini</button> <button id="sh">🔗 مشاركة</button> <button id="ics">📅 تذكيرات التقويم</button> <button id="bk">نسخ احتياطي</button> <button id="rs">استعادة</button></div>

<div class="bar">
  <button class="p" id="bAdd">📷 مسح وإضافة</button>
  <button id="bRem">📷 مسح وإزالة</button>
  <button id="bMan">＋ يدوي</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="restore" accept="application/json" hidden>
<input type="file" id="imgf" accept="image/*" hidden>

<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function(){
var KEY="meds-v1",curImg="",imgCb=null,snap={},sync=null,pT=null,pushing=false,srcImg="",cropAR=4/3,formRem=false,editing=null,items=[],mode="add",pending=null;
var DEFAULT_FB_URL = "https://medecine2026-7220e-default-rtdb.firebaseio.com/";

function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}}
function hs(s){return s.length+":"+s.charCodeAt(10)."."+s.charCodeAt(s.length>>1)."."+s.charCodeAt(s.length-5)}
function meta(it){return JSON.stringify([it.name||"",it.dci||"",it.dosage||"",it.form||"",it.lot||"",it.expiry||"",it.qty||0,it.iv||""])}
function store(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem("meds-snap",JSON.stringify(snap))}catch(e){}}
function setSt(t){var e=$("sy");if(e)e.textContent=t}
function tm(){return new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})}
function save(){
  items.forEach(function(it){it.iv=it.img?hs(it.img):(it.iv||"");if(sync&&snap[it.id]!==meta(it))it.ts=Date.now()});
  store();if(sync)schedulePush()}
function prep(){items.forEach(function(it){if(!it.ts)it.ts=Date.now()})}
function merge(remote){
  var chg=false,need=[];
  Object.keys(remote).forEach(function(id){
    var r=remote[id],l=items.filter(function(i){return i.id===id})[0];
    if(!l||(r.ts||0)>(l.ts||0)){
      var n=Object.assign({},r);n.id=id;
      if(l&&!r.img&&l.img&&l.iv===r.iv)n.img=l.img;
      if(l)items[items.indexOf(l)]=n;else items.push(n);
      snap[id]=meta(n);chg=true;
      if(!n.img&&n.iv)need.push(id)}});
  items=items.filter(function(i){if(!remote[i.id]&&snap[i.id]!==undefined){delete snap[i.id];chg=true;return false}return true});
  if(chg){store();render()}
  return need}
function schedulePush(){clearTimeout(pT);pT=setTimeout(push,700)}
async function push(){
  pT=null;if(!sync)return;pushing=true;
  try{
    var ups=items.filter(function(it){return snap[it.id]!==meta(it)}),dels=Object.keys(snap).filter(function(id){return!items.some(function(i){return i.id===id})});
    for(var i=0;i<ups.length;i++){var it=ups[i],pv=snap[it.id]?JSON.parse(snap[it.id])[7]:null;await sync.put(it,pv!==(it.iv||"")&&(it.img||pv));snap[it.id]=meta(it)}
    for(var j=0;j<dels.length;j++){await sync.del(dels[j]);delete snap[dels[j]]}
    store();setSt("🔄 متزامن · "+tm())
  }catch(e){setSt("⚠️ تعذّرت المزامنة: "+(e&&e.message||""))}
  pushing=false;
  if(sync.lastRemote){var lr=sync.lastRemote;sync.lastRemote=null;merge(lr)}}
function fbReq(p,m,b){return fetch(sync.base+p+".json",{method:m||"GET",body:b===undefined?undefined:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function startFb(cfg){
  sync={base:cfg.u.replace(/\/+$/,"")+"/h/"+cfg.c,
    put:async function(it,imgCh){var o=Object.assign({},it);delete o.img;await fbReq("/items/"+it.id,"PUT",o);if(imgCh){if(it.img)await fbReq("/img/"+it.id,"PUT",it.img);else await fbReq("/img/"+it.id,"DELETE")}},
    del:async function(id){await fbReq("/items/"+id,"DELETE");await fbReq("/img/"+id,"DELETE")}};
  prep();schedulePush();pull();
  setInterval(function(){if(!document.hidden)pull()},20000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}
async function pull(){
  if(!sync||pT||pushing)return;
  try{
    var r=await fbReq("/items","GET")||{};Object.keys(r).forEach(function(k){r[k].id=k});
    var need=merge(r);
    for(var i=0;i<need.length;i++){var s=await fbReq("/img/"+need[i],"GET"),it=items.filter(function(x){return x.id===need[i]})[0];if(it&&s)it.img=s}
    if(need.length){store();render()}
    setSt("🔄 متزامن · "+tm())
  }catch(e){setSt("⚠️ تعذّرت المزامنة: "+(e&&e.message||""))}}
function applyLink(t){try{var m=t.match(/#s=([^\s]+)/),c=JSON.parse(atob(decodeURIComponent(m?m[1]:t.trim())));if(c.u&&c.c){localStorage.setItem("meds-cfg",JSON.stringify(c));return c}}catch(e){}return null}
function openShare(){
  var cfg=null;try{cfg=JSON.parse(localStorage.getItem("meds-cfg")||"null")}catch(e){}
  if(!cfg){
    open('<h2 style="margin:0 0 6px">مشاركة القائمة</h2><div class="msg">الصق رابط قاعدة بيانات Firebase (Realtime Database) ثم فعّل المزامنة.</div><input id="fu" dir="ltr" value="'+DEFAULT_FB_URL+'" placeholder="https://اسم-المشروع-default-rtdb.firebaseio.com"><div class="row" style="margin-top:12px"><button class="p" id="fe">تفعيل المزامنة</button><button id="cx">إغلاق</button></div><div class="msg" id="fm"></div><label>لديك رابط مشاركة من شخص آخر؟ الصقه هنا</label><input id="fl" dir="ltr" placeholder="https://…#s=…"><div class="row" style="margin-top:12px"><button id="fk">ربط</button></div>');
    $("cx").onclick=close;
    $("fe").onclick=function(){var u=$("fu").value.trim().replace(/\/+$/,"");if(!/^https:\/\/[^\s]+$/.test(u)){$("fm").textContent="الرابط غير صحيح";return}var c={u:u,c:Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){return("0"+b.toString(16)).slice(-2)}).join("")};localStorage.setItem("meds-cfg",JSON.stringify(c));startFb(c);openShare()};
    $("fk").onclick=function(){var c=applyLink($("fl").value);if(!c){$("fm").textContent="الرابط غير صالح";return}startFb(c);close()};
    return}
  var link=location.origin+location.pathname+"#s="+encodeURIComponent(btoa(JSON.stringify(cfg)));
  open('<h2 style="margin:0 0 6px">المشاركة مفعّلة ✅</h2><div class="msg">أرسل هذا الرابط لزوجتك. من يملك الرابط يستطيع رؤية القائمة وتعديلها.</div><input id="lk" value="'+esc(link)+'" readonly dir="ltr"><div class="row" style="margin-top:12px"><button class="p" id="cp">نسخ / إرسال</button><button id="cx">إغلاق</button></div><div class="row" style="margin-top:8px"><button class="d" id="off">إيقاف المزامنة على هذا الجهاز</button></div>');
  $("cx").onclick=close;
  $("cp").onclick=function(){if(navigator.share)navigator.share({url:link,title:"أدوية المنزل"}).catch(function(){});else{$("lk").select();document.execCommand("copy")}};
  $("off").onclick=function(){if(confirm("إيقاف المزامنة؟ تبقى القائمة محفوظة على هذا الجهاز.")){localStorage.removeItem("meds-cfg");location.reload()}}}
$("sh").onclick=openShare;
function initSync(){
  if(location.hash.indexOf("#s=")===0)applyLink(location.hash);
  try{
    var cfg=JSON.parse(localStorage.getItem("meds-cfg")||"null");
    if(!cfg){
      cfg={u:DEFAULT_FB_URL, c:"default-room"};
      localStorage.setItem("meds-cfg",JSON.stringify(cfg));
    }
    if(cfg&&cfg.u)startFb(cfg)
  }catch(e){}}

function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,"")}
function endOf(ym){var p=String(ym||"").split("-");if(p.length<2)return null;return new Date(+p[0],+p[1],0,23,59,59)}
function days(ym){var e=endOf(ym);return e?Math.floor((e-new Date())/864e5):null}
function fmt(ym){var p=String(ym||"").split("-");return p.length<2?"—":p[1]+"/"+p[0]}
function status(ym){var d=days(ym);if(d==null)return["b-o","غير معروف"];if(d<0)return["b-r","منتهي منذ "+Math.abs(d)+" يوم"];if(d<=90)return["b-o","ينتهي بعد "+d+" يوم"];return["b-g","صالح"]}
function thumb(it){return it.img?'<img class="th" data-a="v" data-id="'+it.id+'" src="'+it.img+'">':'<div class="th ph" data-a="i" data-id="'+it.id+'">📷</div>'}
function small(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var m=360,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};im.onerror=function(){rej(new Error("img"))};im.src=u})}
function render(){
  var q=norm($("srch").value),r=0,o=0,g=0,ER=[],EO=[],h="";
  var arr=items.slice().sort(function(a,b){return String(a.expiry).localeCompare(String(b.expiry))});
  arr.forEach(function(it){
    var d=days(it.expiry);if(d!=null&&d<0){r+=it.qty;ER.push(it.name)}else if(d!=null&&d<=90){o+=it.qty;EO.push(it.name+" ("+d+" يوم)")}else g+=it.qty;
    if(q&&norm(it.name+it.dci).indexOf(q)<0)return;
    var s=status(it.expiry);
    h+='<div class="card">'+thumb(it)+'<div class="m" data-a="e" data-id="'+it.id+'"><div class="nm"><bdi>'+esc(it.name)+(it.dosage?" "+esc(it.dosage):"")+'</bdi></div><div class="dt">'+esc(it.dci||"")+(it.form?" · "+esc(it.form):"")+'</div><div class="dt">الصلاحية: '+fmt(it.expiry)+(it.lot?" · lot "+esc(it.lot):"")+'</div><div style="margin-top:6px"><span class="badge '+s[0]+'">'+s[1]+'</span></div></div>'+
    '<div class="q"><button data-a="m" data-id="'+it.id+'">−</button><b>'+it.qty+'</b><button data-a="p" data-id="'+it.id+'">+</button></div></div>';
  });
  $("list").innerHTML=h||'<div class="empty">لا توجد أدوية بعد.<br>اضغط «مسح وإضافة» وصوّر ملصق العلبة.</div>';
  $("al").innerHTML=(ER.length?'<div class="al s-r">⚠️ منتهية الصلاحية: '+esc(ER.join("، "))+'</div>':"")+(EO.length?'<div class="al s-o">⏳ تنتهي قريباً: '+esc(EO.join("، "))+'</div>':"");
  $("cR").textContent=r;$("cO").textContent=o;$("cG").textContent=g;
}
function open(html){$("pane").innerHTML=html;$("sheet").classList.add("show")}
function close(){$("sheet").classList.remove("show");pending=null;editing=null}
function form(d,isRem){
  d=d||{};curImg=d.img||"";formRem=isRem;
  return '<h2 style="margin:0 0 4px">'+(editing?"تعديل بيانات الدواء":isRem?"إزالة دواء":"تأكيد بيانات الدواء")+'</h2><div class="msg" id="fm"></div>'+'<div class="row" style="align-items:center"><div style="flex:none;max-width:110px">'+(curImg?'<img id="fImg" class="th" src="'+curImg+'">':'<div id="fImg" class="th ph">📷</div>')+'</div><div><button id="fP" style="width:100%">📷 صورة العلبة</button>'+(srcImg?'<button id="fC" style="width:100%;margin-top:6px">✂︎ ضبط الإطار</button>':'')+'</div></div>'+
  '<label>اسم الدواء</label><input id="fN" value="'+esc(d.name)+'">'+
  '<div class="row"><div><label>المادة الفعالة</label><input id="fD" value="'+esc(d.dci)+'"></div><div><label>الجرعة</label><input id="fG" value="'+esc(d.dosage)+'"></div></div>'+
  '<div class="row"><div><label>الشكل</label><input id="fF" value="'+esc(d.form)+'"></div><div><label>رقم الدفعة (Lot)</label><input id="fL" value="'+esc(d.lot)+'"></div></div>'+
  '<div class="row"><div><label>تاريخ الانتهاء</label><input type="month" id="fE" value="'+esc(d.expiry)+'"></div><div><label>عدد العلب</label><input type="number" min="1" id="fQ" value="'+(d.qty||1)+'"></div></div>'+
  '<div class="row" style="margin-top:16px"><button class="p" id="ok">'+(editing?"حفظ":isRem?"إزالة":"إضافة")+'</button><button id="cx">إلغاء</button>'+(editing?'<button class="d" id="dl">حذف</button>':'')+'</div>';
}
function read(){return{name:$("fN").value.trim(),dci:$("fD").value.trim(),dosage:$("fG").value.trim(),form:$("fF").value.trim(),lot:$("fL").value.trim(),expiry:$("fE").value,qty:Math.max(1,parseInt($("fQ").value)||1),img:curImg}}
function find(d){
  var n=norm(d.name),l=norm(d.lot);
  var c=items.filter(function(i){return norm(i.name)===n&&norm(i.dosage)===norm(d.dosage)});
  var x=c.filter(function(i){return l&&norm(i.lot)===l})[0]||c.filter(function(i){return i.expiry===d.expiry})[0]||c[0];
  return x||null
}
function doAdd(d){
  if(!d.name){return"أدخل اسم الدواء"}
  var x=items.filter(function(i){return norm(i.name)===norm(d.name)&&norm(i.dosage)===norm(d.dosage)&&i.expiry===d.expiry})[0];
  if(x){x.qty+=d.qty;if(d.img&&!x.img)x.img=d.img}else{d.id="m"+Date.now()+Math.floor(Math.random()*999);items.push(d)}
  save();render();close();return""
}
function doEdit(d){if(!d.name)return"أدخل اسم الدواء";var it=editing;it.name=d.name;it.dci=d.dci;it.dosage=d.dosage;it.form=d.form;it.lot=d.lot;it.expiry=d.expiry;it.qty=d.qty;if(d.img)it.img=d.img;save();render();close();return""}
function editItem(it){editing=it;srcImg="";open(form(it,false));wire(false)}
function doRem(d){
  var x=find(d);if(!x)return"هذا الدواء غير موجود في القائمة";
  x.qty-=d.qty;if(x.qty<=0)items=items.filter(function(i){return i!==x});
  save();render();close();return""
}
function wire(isRem){
  $("cx").onclick=close;
  $("fP").onclick=function(){imgCb=function(u){srcImg=u;editCrop()};$("imgf").value="";$("imgf").click()};
  if($("fC"))$("fC").onclick=editCrop;
  if($("dl"))$("dl").onclick=function(){if(confirm("حذف "+editing.name+" نهائيا؟")){items=items.filter(function(i){return i!==editing});save();render();close()}};
  $("ok").onclick=function(){var d=read();var e=editing?doEdit(d):isRem?doRem(d):doAdd(d);if(e){$("fm").textContent=e;$("fm").className="msg err"}}
}
