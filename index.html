<head>

<title>صيدلية البيت</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2b25;--mut:#68766f;--pri:#17795c;--pri-t:#fff;--bd:#e1e6e2;--red:#c0392b;--org:#c77a0a;--grn:#17795c;--redb:#fbe9e6;--orgb:#fdf1de;--grnb:#e4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;padding:0 14px 120px}
h1{font-size:20px;margin:16px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.st{flex:1;border-radius:12px;padding:8px;text-align:center;font-size:12px}
.st b{display:block;font-size:20px}
.s-r{background:var(--redb);color:var(--red)}.s-o{background:var(--orgb);color:var(--org)}.s-g{background:var(--grnb);color:var(--grn)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card .m{flex:1;min-width:0}
.nm{font-weight:700}
.dt{font-size:12px;color:var(--mut);margin-top:2px}
.badge{font-size:12px;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-r{background:var(--redb);color:var(--red)}.b-o{background:var(--orgb);color:var(--org)}.b-g{background:var(--grnb);color:var(--grn)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer}
button.p{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:700}
button.d{color:var(--red)}
.q{display:flex;align-items:center;gap:6px}
.q button{padding:4px 10px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px}
.bar button{flex:1;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}.seg button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.pane{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>div{flex:1}
.th{height:60px;width:auto;min-width:48px;max-width:110px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;cursor:pointer}.ph{display:flex;align-items:center;justify-content:center;font-size:22px;width:60px}.al{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.7}.hd{display:flex;align-items:center;gap:12px;margin:14px 0 8px}.hd h1{margin:0}.avw{cursor:pointer;flex:none}.av{width:80px;height:94px;border-radius:18px;object-fit:cover;object-position:top;border:2px solid var(--pri);display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--grnb)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.msg{font-size:13px;margin:8px 0;color:var(--mut)}
.msg.err{color:var(--red)}
.note{font-size:12px;color:var(--mut);margin-top:16px;text-align:center}
</style>
</head>

    if(!r.ok){alert("رفض Google الطلب: "+r.status+"\n"+((j.error&&j.error.message)||""));return}

    alert("الاتصال ناجح ✅ المفتاح يعمل.\nنماذج Flash المتاحة:\n"+n.slice(0,12).join("\n"))
  }catch(e){alert("لا يصل المتصفح إلى Google: "+(e&&e.message||"network")+"\nجرّب تعطيل VPN/Private Relay أو حاجب الإعلانات أو غيّر الشبكة.")}
};
