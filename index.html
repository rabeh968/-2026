<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17795c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أدوية">
<title>أدوية المنزل</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2b25;--mut:#68766f;--pri:#17795c;--pri-t:#fff;--bd:#e1e6e2;--red:#c0392b;--org:#c77a0a;--grn:#17795c;--redb:#fbe9e6;--orgb:#fdf1de;--grnb:#e4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e8efeb;--mut:#92a29a;--pri:#3fb48f;--pri-t:#08150f;--bd:#2a3731;--red:#ff8576;--org:#f0b45a;--grn:#5fcfa9;--redb:#3a1f1b;--orgb:#3a2c14;--grnb:#16322a}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;padding:0 14px 120px}
h1{font-size:20px;margin:16px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.st{flex:1;border-radius:12px;padding:8px;text-align:center;font-size:12px}
.st b{display:block;font-size:20px}
.s-r{background:var(--redb);color:var(--red)}.s-o{background:var(--orgb);color:var(--org)}.s-g{background:var(--grnb);color:var(--grn)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card .m{flex:1;min-width:0}
.nm{font-weight:700}
.dt{font-size:12px;color:var(--mut);margin-top:2px}
.badge{font-size:12px;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-r{background:var(--redb);color:var(--red)}.b-o{background:var(--orgb);color:var(--org)}.b-g{background:var(--grnb);color:var(--grn)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer}
button.p{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:700}
button.d{color:var(--red)}
.q{display:flex;align-items:center;gap:6px}
.q button{padding:4px 10px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px}
.bar button{flex:1;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}.seg button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.pane{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>div{flex:1}
.th{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;cursor:pointer}.ph{display:flex;align-items:center;justify-content:center;font-size:22px}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.msg{font-size:13px;margin:8px 0;color:var(--mut)}
.msg.err{color:var(--red)}
.note{font-size:12px;color:var(--mut);margin-top:16px;text-align:center}
</style>
</head>
<body>
<h1>💊 أدوية المنزل</h1>
<div class="sub">قائمة الأدوية المتوفرة مع تواريخ انتهاء الصلاحية</div>
<div class="stats">
  <div class="st s-r"><b id="cR">0</b>منتهية</div>
  <div class="st s-o"><b id="cO">0</b>تنتهي خلال 90 يوماً</div>
  <div class="st s-g"><b id="cG">0</b>صالحة</div>
</div>
<input id="srch" placeholder="بحث باسم الدواء أو المادة الفعالة…">
<div id="list"></div>
<div class="note">البيانات محفوظة في هذا المتصفح فقط. استعمل «نسخ احتياطي» للحفظ.</div>
<div class="note"><button id="gt">اختبار الاتصال</button> <button id="gs">⚙︎ مفتاح Gemini</button> <button id="bk">نسخ احتياطي</button> <button id="rs">استعادة</button></div>

<div class="bar">
  <button class="p" id="bAdd">📷 مسح وإضافة</button>
  <button id="bRem">📷 مسح وإزالة</button>
  <button id="bMan">＋ يدوي</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="restore" accept="application/json" hidden>
<input type="file" id="imgf" accept="image/*" hidden>

<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function(){
var KEY="meds-v1",curImg="",imgCb=null,items=[],mode="add",pending=null;
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,"")}
function endOf(ym){var p=String(ym||"").split("-");if(p.length<2)return null;return new Date(+p[0],+p[1],0,23,59,59)}
function days(ym){var e=endOf(ym);return e?Math.floor((e-new Date())/864e5):null}
function fmt(ym){var p=String(ym||"").split("-");return p.length<2?"—":p[1]+"/"+p[0]}
function status(ym){var d=days(ym);if(d==null)return["b-o","غير معروف"];if(d<0)return["b-r","منتهي منذ "+Math.abs(d)+" يوم"];if(d<=90)return["b-o","ينتهي بعد "+d+" يوم"];return["b-g","صالح"]}
function thumb(it){return it.img?'<img class="th" data-a="v" data-id="'+it.id+'" src="'+it.img+'">':'<div class="th ph" data-a="i" data-id="'+it.id+'">📷</div>'}
function small(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var m=360,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};im.onerror=function(){rej(new Error("img"))};im.src=u})}
function render(){
  var q=norm($("srch").value),r=0,o=0,g=0,h="";
  var arr=items.slice().sort(function(a,b){return String(a.expiry).localeCompare(String(b.expiry))});
  arr.forEach(function(it){
    var d=days(it.expiry);if(d!=null&&d<0)r+=it.qty;else if(d!=null&&d<=90)o+=it.qty;else g+=it.qty;
    if(q&&norm(it.name+it.dci).indexOf(q)<0)return;
    var s=status(it.expiry);
    h+='<div class="card">'+thumb(it)+'<div class="m"><div class="nm"><bdi>'+esc(it.name)+(it.dosage?" "+esc(it.dosage):"")+'</bdi></div><div class="dt">'+esc(it.dci||"")+(it.form?" · "+esc(it.form):"")+'</div><div class="dt">الصلاحية: '+fmt(it.expiry)+(it.lot?" · lot "+esc(it.lot):"")+'</div><div style="margin-top:6px"><span class="badge '+s[0]+'">'+s[1]+'</span></div></div>'+
    '<div class="q"><button data-a="m" data-id="'+it.id+'">−</button><b>'+it.qty+'</b><button data-a="p" data-id="'+it.id+'">+</button></div></div>';
  });
  $("list").innerHTML=h||'<div class="empty">لا توجد أدوية بعد.<br>اضغط «مسح وإضافة» وصوّر ملصق العلبة.</div>';
  $("cR").textContent=r;$("cO").textContent=o;$("cG").textContent=g;
}
function open(html){$("pane").innerHTML=html;$("sheet").classList.add("show")}
function close(){$("sheet").classList.remove("show");pending=null}
function form(d,isRem){
  d=d||{};curImg=d.img||"";
  return '<h2 style="margin:0 0 4px">'+(isRem?"إزالة دواء":"تأكيد بيانات الدواء")+'</h2><div class="msg" id="fm"></div>'+'<div class="row" style="align-items:center"><div style="flex:none;max-width:64px">'+(curImg?'<img id="fImg" class="th" src="'+curImg+'">':'<div id="fImg" class="th ph">📷</div>')+'</div><div><button id="fP" style="width:100%">📷 صورة العلبة</button></div></div>'+
  '<label>اسم الدواء</label><input id="fN" value="'+esc(d.name)+'">'+
  '<div class="row"><div><label>المادة الفعالة</label><input id="fD" value="'+esc(d.dci)+'"></div><div><label>الجرعة</label><input id="fG" value="'+esc(d.dosage)+'"></div></div>'+
  '<div class="row"><div><label>الشكل</label><input id="fF" value="'+esc(d.form)+'"></div><div><label>رقم الدفعة (Lot)</label><input id="fL" value="'+esc(d.lot)+'"></div></div>'+
  '<div class="row"><div><label>تاريخ الانتهاء</label><input type="month" id="fE" value="'+esc(d.expiry)+'"></div><div><label>عدد العلب</label><input type="number" min="1" id="fQ" value="'+(d.qty||1)+'"></div></div>'+
  '<div class="row" style="margin-top:16px"><button class="p" id="ok">'+(isRem?"إزالة":"إضافة")+'</button><button id="cx">إلغاء</button></div>';
}
function read(){return{name:$("fN").value.trim(),dci:$("fD").value.trim(),dosage:$("fG").value.trim(),form:$("fF").value.trim(),lot:$("fL").value.trim(),expiry:$("fE").value,qty:Math.max(1,parseInt($("fQ").value)||1),img:curImg}}
function find(d){
  var n=norm(d.name),l=norm(d.lot);
  var c=items.filter(function(i){return norm(i.name)===n&&norm(i.dosage)===norm(d.dosage)});
  var x=c.filter(function(i){return l&&norm(i.lot)===l})[0]||c.filter(function(i){return i.expiry===d.expiry})[0]||c[0];
  return x||null
}
function doAdd(d){
  if(!d.name){return"أدخل اسم الدواء"}
  var x=items.filter(function(i){return norm(i.name)===norm(d.name)&&norm(i.dosage)===norm(d.dosage)&&i.expiry===d.expiry})[0];
  if(x){x.qty+=d.qty;if(d.img&&!x.img)x.img=d.img}else{d.id="m"+Date.now()+Math.floor(Math.random()*999);items.push(d)}
  save();render();close();return""
}
function doRem(d){
  var x=find(d);if(!x)return"هذا الدواء غير موجود في القائمة";
  x.qty-=d.qty;if(x.qty<=0)items=items.filter(function(i){return i!==x});
  save();render();close();return""
}
function wire(isRem){
  $("cx").onclick=close;
  $("fP").onclick=function(){imgCb=function(u){curImg=u;$("fImg").outerHTML='<img id="fImg" class="th" src="'+u+'">'};$("imgf").value="";$("imgf").click()};
  $("ok").onclick=function(){var d=read();var e=isRem?doRem(d):doAdd(d);if(e){$("fm").textContent=e;$("fm").className="msg err"}}
}
function attach(it){imgCb=function(u){it.img=u;save();render()};$("imgf").value="";$("imgf").click()}
function view(it){open('<img src="'+it.img+'" style="width:100%;border-radius:12px"><div class="row" style="margin-top:12px"><button id="chg">تغيير الصورة</button><button class="p" id="cx">إغلاق</button></div>');$("cx").onclick=close;$("chg").onclick=function(){close();attach(it)}}
function manual(){open(form({},false));wire(false)}
function shrink(f){return new Promise(function(res,rej){
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){var m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("img"))},"image/jpeg",.85)};
  im.onerror=function(){rej(new Error("img"))};im.src=u})}
var worker=null;
function parse(t){
  var L=t.split(/\n/).map(function(x){return x.trim()}).filter(Boolean),d={name:"",dci:"",dosage:"",form:"",lot:"",expiry:"",qty:1};
  var ds=[],m,re=/(\d{1,2})\s*[\/\-.]\s*(20\d{2}|\d{2})\b/g;
  while((m=re.exec(t))){var mo=+m[1],y=m[2].length===2?2000+ +m[2]:+m[2];if(mo>=1&&mo<=12)ds.push(y*100+mo)}
  var ex=t.match(/(?:EXP|PER|P[e\u00e9]remption)\w*\s*[:.]?\s*(\d{1,2})\s*[\/\-.]\s*(20\d{2}|\d{2})/i);
  var v=ex?(+(ex[2].length===2?2000+ +ex[2]:+ex[2]))*100+ +ex[1]:(ds.length?Math.max.apply(null,ds):0);
  if(v)d.expiry=Math.floor(v/100)+"-"+("0"+(v%100)).slice(-2);
  var lo=t.match(/\bLOT\s*[:.]?\s*([A-Z0-9]{2,})/i);if(lo)d.lot=lo[1];
  var dz=t.match(/(\d+(?:[.,]\d+)?)\s*(mg|g|ml|%|\u00b5g|ui)\b/i);if(dz)d.dosage=dz[1]+" "+dz[2];
  var dc=t.match(/DCI\s*[:.]?\s*([A-Za-z\u00c0-\u00ff]+)/i);if(dc)d.dci=dc[1];
  var fm=t.match(/(comprim[e\u00e9]s?[^\n,]*|g[e\u00e9]lules?|gel\s+\w+|pommade|sirop|solution[^\n,]*|suppositoires?|poudre[^\n,]*)/i);if(fm)d.form=fm[1].trim();
  var vi=-1;L.forEach(function(x,i){if(vi<0&&/vignette/i.test(x))vi=i});
  var cand=(vi>=0?L.slice(vi+1,vi+4):L).filter(function(x){return /^[A-Za-z][A-Za-z0-9 \-]{2,}$/.test(x)&&!/vignette|labor|inpha|prix|ppa|lot|fab|exp/i.test(x)});
  if(cand[0])d.name=cand[0].replace(/\s+\d+\s*(mg|g)?$/i,"");
  return d}
var PROMPT='هذه صورة علبة دواء (غالبا جزائرية، عليها ملصق vignette). استخرج البيانات وأعد JSON فقط بالشكل: {"name":"الاسم التجاري بحروف لاتينية","dci":"المادة الفعالة","dosage":"مثل 500 mg","form":"الشكل مثل comprimé","lot":"رقم الدفعة LOT","expiry":"YYYY-MM"}. تاريخ الانتهاء هو الحقل EXP أو PER وليس FAB (تاريخ الصنع). إن كان مكتوبا 03/2029 أو 03/29 فالنتيجة 2029-03. إن لم تجد قيمة اتركها نصا فارغا ولا تخمن.';
function b64(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result.split(",")[1])};r.readAsDataURL(b)})}
async function gem(b,k){
  var pick=localStorage.getItem("gmodel"),ms=[pick,"gemini-3.6-flash","gemini-2.5-flash","gemini-3.8-flash"].filter(function(x,i,a){return x&&a.indexOf(x)===i});
  var data=await b64(b),last="خطأ من Gemini",body=JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:"image/jpeg",data:data}}]}],generationConfig:{responseMimeType:"application/json",temperature:0}});
  for(var i=0;i<ms.length;i++){
    for(var t=0;t<2;t++){
      var r,j;
      try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+ms[i]+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:body});j=await r.json().catch(function(){return{}})}
      catch(e){last="تعذّر الاتصال بخوادم Google عبر "+ms[i]+" ("+(e&&e.message||"network")+")";await new Promise(function(z){setTimeout(z,1500)});continue}
      if(r.ok){
        var tx=j.candidates[0].content.parts[0].text,d=JSON.parse(tx.replace(/```json|```/g,""));
        d.qty=1;d.name=d.name||"";d.expiry=/^\d{4}-\d{2}$/.test(d.expiry||"")?d.expiry:"";return d}
      last=(j.error&&j.error.message)||last;
      if(r.status===400||r.status===401||r.status===403)throw{message:last};
      if(r.status===404)break;
      await new Promise(function(z){setTimeout(z,1500)});
    }
  }
  throw{message:last+" — إن تكرر: عطّل VPN/Private Relay/حاجب الإعلانات، أو بدّل بين Wi‑Fi والبيانات، ثم أعد المحاولة."}}
async function scan(f){
  open('<h2 style="margin:0">\u062c\u0627\u0631\u064a \u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0645\u0644\u0635\u0642\u2026</h2><div class="msg" id="pg">\u062a\u062d\u0645\u064a\u0644 \u0645\u062d\u0631\u0643 \u0627\u0644\u0642\u0631\u0627\u0621\u0629 (\u0623\u0648\u0644 \u0645\u0631\u0629 \u0642\u062f \u062a\u0633\u062a\u063a\u0631\u0642 \u0648\u0642\u062a\u0627\u064b)</div>');
  try{
    var bl=await shrink(f),d,gk=localStorage.getItem("gkey");
    if(gk){d=await gem(bl,gk)}else{
      if(!window.Tesseract)throw{message:"تعذّر تحميل محرك OCR. أضف مفتاح Gemini أو اتصل بالإنترنت."};
      if(!worker)worker=await Tesseract.createWorker("fra");
      var r=await worker.recognize(bl);d=parse(r.data.text||"")}
    d.img=await small(f).catch(function(){return""});open(form(d,mode==="rem"));wire(mode==="rem");
    if(!d.expiry||!d.name){$("fm").textContent="\u0631\u0627\u062c\u0639 \u0627\u0644\u062d\u0642\u0648\u0644 \u0648\u0623\u0643\u0645\u0644 \u0645\u0627 \u0644\u0645 \u064a\u0642\u0631\u0623\u0647 \u0627\u0644\u062a\u0637\u0628\u064a\u0642.";$("fm").className="msg err"}
  }catch(e){
    open('<h2 style="margin:0 0 6px">\u062a\u0639\u0630\u0651\u0631\u062a \u0627\u0644\u0642\u0631\u0627\u0621\u0629</h2><div class="msg err">'+esc((e&&e.message)||"\u062e\u0637\u0623")+'</div><div class="row"><button class="p" id="mn">\u0625\u062f\u062e\u0627\u0644 \u064a\u062f\u0648\u064a</button><button id="cx">\u0625\u063a\u0644\u0627\u0642</button></div>');
    $("cx").onclick=close;$("mn").onclick=manual}
}
$("bAdd").onclick=function(){mode="add";$("file").value="";$("file").click()};
$("bRem").onclick=function(){mode="rem";$("file").value="";$("file").click()};
$("bMan").onclick=manual;
$("file").onchange=function(){if(this.files[0])scan(this.files[0])};
$("srch").oninput=render;
$("imgf").onchange=function(){var f=this.files[0];if(f&&imgCb)small(f).then(function(u){imgCb(u)}).catch(function(){alert("تعذّر قراءة الصورة")})};
$("sheet").onclick=function(e){if(e.target===this)close()};
$("list").onclick=function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var it=items.filter(function(i){return i.id===b.dataset.id})[0];if(!it)return;
  if(b.dataset.a==="v"){view(it);return}if(b.dataset.a==="i"){attach(it);return}if(b.dataset.a==="p")it.qty++;else{it.qty--;if(it.qty<=0&&confirm("إزالة "+it.name+" من القائمة؟"))items=items.filter(function(i){return i!==it});else if(it.qty<=0)it.qty=1}
  save();render()
};
$("bk").onclick=function(){var u=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="medicines-backup.json";l.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
$("gt").onclick=async function(){
  var k=localStorage.getItem("gkey");
  if(!k){alert("لم تُدخل مفتاحا بعد. اضغط ⚙︎ مفتاح Gemini.");return}
  try{
    var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",{headers:{"x-goog-api-key":k}});
    var j=await r.json().catch(function(){return{}});
    if(!r.ok){alert("رفض Google الطلب: "+r.status+"\n"+((j.error&&j.error.message)||""));return}
    var n=(j.models||[]).map(function(m){return m.name.replace("models/","")}).filter(function(x){return /gemini/.test(x)&&/flash/.test(x)&&!/image|tts|live|audio/.test(x)});
    alert("الاتصال ناجح ✅ المفتاح يعمل.\nنماذج Flash المتاحة:\n"+n.slice(0,12).join("\n"))
  }catch(e){alert("لا يصل المتصفح إلى Google: "+(e&&e.message||"network")+"\nجرّب تعطيل VPN/Private Relay أو حاجب الإعلانات أو غيّر الشبكة.")}
};
$("gs").onclick=function(){
  var k=prompt("الصق مفتاح Gemini (يُحفظ في هذا المتصفح فقط). اتركه فارغا لحذفه.",localStorage.getItem("gkey")||"");
  if(k===null)return;k=k.trim();
  if(!k){localStorage.removeItem("gkey");alert("تم حذف المفتاح. سيُستعمل OCR.");return}
  localStorage.setItem("gkey",k);
  var m=prompt("اسم النموذج (غيّره فقط إن توقف القديم):",localStorage.getItem("gmodel")||"gemini-2.5-flash");
  if(m&&m.trim())localStorage.setItem("gmodel",m.trim());
  alert("تم الحفظ.")
};
$("rs").onclick=function(){$("restore").click()};
$("restore").onchange=function(){
  var f=this.files[0];if(!f)return;
  f.text().then(function(t){var a=JSON.parse(t);if(Array.isArray(a)){items=a;save();render()}}).catch(function(){alert("ملف غير صالح")})
};
load();render();
})();
